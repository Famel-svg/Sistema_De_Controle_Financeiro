spring:
  application:
    name: fintech
  datasource:
    # Sem valores padrão: as credenciais vêm sempre do ambiente.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
